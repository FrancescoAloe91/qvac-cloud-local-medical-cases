# Band A (cloud OpenRouter) + Band B (open GGUFs on-device via QVAC sidecar) + MedPsy.
# Band B peers are injected by benchmark/qvac_variants.py (not listed here) so paths stay DRY.
# Override judge: BENCHMARK_JUDGE_MODEL=...

profile: openrouter_api_controlled

candidates:
  # --- Band A · exact OpenRouter API models (not consumer/free-web equivalents) ---
  - key: chatgpt
    label: OpenAI GPT-5.5 API
    display_label: OpenAI · GPT-5.5 · API
    vendor: OpenAI
    site: chatgpt.com
    color: "#10a37f"
    provider: openrouter
    model: openai/gpt-5.5
    band: api
  - key: claude
    label: Anthropic Claude Sonnet 5 API
    display_label: Anthropic · Claude Sonnet 5 · API
    vendor: Anthropic
    site: claude.ai
    color: "#d97706"
    provider: openrouter
    model: anthropic/claude-sonnet-5
    band: api
  - key: gemini
    label: Google Gemini 3.5 Flash API
    display_label: Google · Gemini 3.5 Flash · API
    vendor: Google
    site: gemini.google.com
    color: "#8ab4f8"
    provider: openrouter
    model: google/gemini-3.5-flash
    band: api
  # Band B · open Q4 GGUFs (local_gemma / local_llama / local_phi) — see qvac_variants.py
  # Default on-device MedPsy slot (4B Q4). Toggle "3× QVAC" adds 1.7B Q4 + 4B Q8.
  - key: qvac
    label: MedPsy 4B Q4
    display_label: QVAC · MedPsy-4B Q4 · on-device
    vendor: Tether QVAC
    site: local (QVAC SDK)
    color: "#00d09c"
    provider: qvac
    model: medpsy-4b-q4

judge:
  # Primary blind judge. A pinned Claude verifier is used only for anomalies.
  model: deepseek/deepseek-r1
  display_label: Judge · DeepSeek · R1 (blind, independent)
  temperature: 0
  anonymize: true
  verifier_model: anthropic/claude-sonnet-5

# Token assumptions for --dry-run (length-aware estimate also uses live case/gold chars)
estimate:
  candidate_input_tokens: 1800  # legacy CLI hint only; UI estimate uses real text length
  candidate_output_tokens: 900
  judge_input_tokens_per_question: 2800
  judge_output_tokens_per_question: 400
