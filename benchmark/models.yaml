# Band A (cloud OpenRouter) + Band B (open GGUFs on-device via QVAC sidecar) + MedPsy.
# Band B peers are injected by benchmark/qvac_variants.py (not listed here) so paths stay DRY.
# Override judge: BENCHMARK_JUDGE_MODEL=...
# Override extractor: BENCHMARK_GOLD_EXTRACTOR_MODEL=... (default openai/gpt-4o-mini)

profile: openrouter_api_controlled

# Controlled track (default UI label "best-effort"): preferred provider order is
# recorded and requested; allow_fallbacks stays enabled so a brief vendor outage
# does not turn ChatGPT/Claude into technical N/A. Opt-in strict_controlled
# disables fallbacks and marks route misses as N/A.
extractor:
  model: openai/gpt-4o-mini
  allowed_providers:
    - OpenAI

candidates:
  # --- Band A · exact OpenRouter API models (not consumer/free-web equivalents) ---
  - key: chatgpt
    label: OpenAI GPT-5.5 API
    display_label: OpenAI · GPT-5.5 · API
    vendor: OpenAI
    site: chatgpt.com
    color: "#10a37f"
    provider: openrouter
    model: openai/gpt-5.5
    band: api
    allowed_providers:
      - OpenAI
  - key: claude
    label: Anthropic Claude Sonnet 5 API
    display_label: Anthropic · Claude Sonnet 5 · API
    vendor: Anthropic
    site: claude.ai
    color: "#d97706"
    provider: openrouter
    model: anthropic/claude-sonnet-5
    band: api
    allowed_providers:
      - Anthropic
  - key: gemini
    label: Google Gemini 3.5 Flash API
    display_label: Google · Gemini 3.5 Flash · API
    vendor: Google
    site: gemini.google.com
    color: "#8ab4f8"
    provider: openrouter
    model: google/gemini-3.5-flash
    band: api
    allowed_providers:
      - Google
  # Band B · open Q4 GGUFs (local_gemma / local_llama / local_phi) — see qvac_variants.py
  # Default on-device MedPsy slot (4B Q4). Toggle "3× QVAC" adds 1.7B Q4 + 4B Q8.
  - key: qvac
    label: MedPsy 4B Q4
    display_label: QVAC · MedPsy-4B Q4 · on-device
    vendor: Tether QVAC
    site: local (QVAC SDK)
    color: "#00d09c"
    provider: qvac
    model: medpsy-4b-q4

judge:
  # Primary blind judge. If recovery is needed, the independent verifier
  # re-judges the complete candidate set so one ranking never mixes judges.
  model: deepseek/deepseek-r1
  display_label: Judge · DeepSeek · R1 (blind, independent)
  temperature: 0
  anonymize: true
  verifier_model: qwen/qwen3.5-397b-a17b
  allowed_providers:
    - DeepSeek
  verifier_allowed_providers:
    - Alibaba
    - Together
    - Fireworks
    - DeepInfra

# Token assumptions for pre-run forecast (rough · often over).
# Baseline uses *typical* completions — never the API max_tokens cap as billable.
# When History has comparable runs, UI/CLI calibrate from actual usage.cost.
estimate:
  candidate_input_tokens: 1800  # legacy CLI hint only; UI estimate uses real text length
  candidate_output_tokens: 2000  # ~observed cloud median
  extractor_output_tokens: 900  # typical extract; not the 4k cap
  judge_output_tokens: 5500  # typical DeepSeek R1 judge completion (cap is 16384)
  judge_output_tokens_high: 8500  # ~p90 for upper band
  repair_rate_per_judge_call: 0.08  # upper: uncommon section repair
  verifier_rate_per_judge_call: 0.05  # upper: uncommon systemic re-judge
  judge_input_tokens_per_question: 2800  # legacy hint; live estimate builds from case/gold
  judge_output_tokens_per_question: 1600  # legacy; unused by live forecast
