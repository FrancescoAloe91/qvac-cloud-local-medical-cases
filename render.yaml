services:
  - type: web
    name: qvac-cloud-local-medical-cases
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Refuse host OPENROUTER_API_KEY fallback; visitors must BYOK.
      - key: HOSTED_BYOK
        value: "1"
      - key: STREAMLIT_SERVER_ADDRESS
        value: "0.0.0.0"
